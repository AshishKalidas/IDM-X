<!doctype html>
<meta charset="utf-8" />
<title>IDMX</title>
<style>
  :root { color-scheme: light dark; font: 14px -apple-system, system-ui, sans-serif; }
  body { width: 340px; margin: 0; padding: 18px; }
  h1 { font-size: 17px; margin: 0 0 4px; } p { margin: 0 0 14px; opacity: .65; font-size: 12.5px; }
  label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 5px; opacity: .7; }
  input[type=text], input[type=password], input[type=number] { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 9px; border: 1px solid #8884; background: #8881; font: inherit; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  button { margin-top: 16px; width: 100%; padding: 9px; border: 0; border-radius: 999px; background: #0a84ff; color: #fff; font: 600 14px inherit; }
  #status { margin-top: 10px; font-size: 12.5px; min-height: 16px; }
</style>
<h1>IDMX</h1>
<p>Pair with the IDMX app: Automation → Browser integration.</p>
<label>Server</label><input id="server" type="text" />
<label>Access token</label><input id="token" type="password" />
<div class="row"><span>Take over browser downloads</span><input id="takeOver" type="checkbox" /></div>
<label>…only if bigger than (MB)</label><input id="minSize" type="number" min="0" />
<button id="save">Save &amp; test</button>
<div id="status"></div>
<script src="options.js"></script>
