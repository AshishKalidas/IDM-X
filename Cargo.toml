[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["IDMX"]

[workspace.dependencies]
idmx-core = { path = "crates/core" }
idmx-server = { path = "crates/server" }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
rand = "0.9"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
